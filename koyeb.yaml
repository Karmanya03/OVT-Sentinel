name: ovt-sentinel
services:
  - name: sentinel-bot
    type: worker
    instance: micro
    docker:
      dockerfile: sentinel-bot/Dockerfile
      context: .
    ports:
      - port: 8000
    volumes:
      - name: sentinel-data
        path: /app/data
    envs:
      - key: SENTINEL_DATA_DIR
        value: /app/data
      - key: AGENT_WS
        value: ws://127.0.0.1:7331
      - key: GEMINI_MODEL
        value: models/gemini-2.5-flash
      - key: USE_AGENT_TOOLS
        value: "true"
      - key: USE_WEB_SEARCH
        value: "true"
      - key: REQUIRE_CONFIRM_DESTRUCTIVE
        value: "true"
      - key: LAZY_AGENT_CONNECT
        value: "true"
      - key: LOG_LEVEL
        value: INFO
    scalings:
      min: 1
      max: 1
    regions:
      - fra

  - name: sentinel-db
    type: postgres
    service:
      version: "16"
      size: 1
    volumes:
      - name: pg-data
        path: /var/lib/postgresql/data
