name: ovt-sentinel
services:
  - name: sentinel-bot
    type: worker
    instance: micro
    docker:
      dockerfile: sentinel-bot/Dockerfile
      context: .
    ports:
      - port: 8000
        protocols: [http]
    volumes:
      - name: sentinel-data
        path: /app/data
    envs:
      - key: SENTINEL_DATA_DIR
        value: /app/data
      - key: SERVER_PORT
        value: "8000"
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-nano-30b-a3b
      - key: NVIDIA_VISION_MODEL
        value: moonshotai/kimi-k2.6
      - key: USE_AGENT_TOOLS
        value: "true"
      - key: USE_WEB_SEARCH
        value: "true"
      - key: REQUIRE_CONFIRM_DESTRUCTIVE
        value: "true"
      - key: LAZY_AGENT_CONNECT
        value: "true"
      - key: BOT_PUBLIC_URL
        value: https://cloudy-cairistiona-karmanya03-f923e767.koyeb.app/
      - key: LOG_LEVEL
        value: INFO
    scalings:
      min: 1
      max: 1
    regions:
      - fra

  - name: sentinel-db
    type: postgres
    service:
      version: "16"
      size: 1
    volumes:
      - name: pg-data
        path: /var/lib/postgresql/data
