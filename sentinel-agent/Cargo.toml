[package]
name = "sentinel-agent"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sentinel-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
tungstenite = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
notify = "7"
sysinfo = "0.33"
futures-util = "0.3"
tokio-stream = "0.1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
base64 = "0.22"
native-tls = "0.2"
tokio-native-tls = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
